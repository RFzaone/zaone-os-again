name: Build zaone ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Build zaone ISO
        run: |
          docker pull debian:trixie

          docker run --rm --privileged \
            -v "${PWD}:/workspace" \
            -w /workspace \
            debian:trixie \
            bash -lc '
              set -Eeuo pipefail
              apt-get update
              apt-get install -y \
                live-build debootstrap xorriso isolinux \
                syslinux-common squashfs-tools ca-certificates \
                debian-archive-keyring
              chmod +x build.sh
              ./build.sh
            '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: zaone-v1-iso
          path: out/
          if-no-files-found: error
