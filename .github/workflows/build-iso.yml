name: Build zaone ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "build.sh"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Docker
        run: |
          docker --version
          docker pull debian:trixie

      - name: Build zaone ISO in privileged Debian Trixie
        run: |
          docker run --rm --privileged             -v "$GITHUB_WORKSPACE:/workspace"             -w /workspace             debian:trixie             bash -lc '
              set -e
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y                 live-build                 debootstrap                 xorriso                 isolinux                 syslinux-common                 squashfs-tools                 ca-certificates                 curl                 git
              chmod +x build.sh
              ./build.sh
            '

      - name: Show output files
        run: |
          ls -lah out
          test -f out/zaone-v1-amd64.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: zaone-v1-iso
          path: |
            out/zaone-v1-amd64.iso
            out/zaone-v1-amd64.iso.sha256
            out/build.log
          retention-days: 14
          if-no-files-found: error
