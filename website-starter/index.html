<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zaone OS</title>
<style>
body{font-family:system-ui;background:#08111f;color:#fff;max-width:900px;margin:60px auto;padding:24px}
.card{background:#111d2f;border:1px solid #29415f;border-radius:18px;padding:22px;margin:18px 0}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #547398}
button{cursor:pointer}
small{color:#abc}
</style>
</head>
<body>
<h1>zaone OS</h1>
<p>Free. Ad-free. Built to put the user first.</p>
<div class="card">
<h2>Downloads</h2>
<p>Upload ISO releases to GitHub Releases and place the download link here.</p>
</div>
<div class="card">
<h2>Crash-code checker</h2>
<label for="code">Crash code</label><br>
<input id="code" placeholder="ZA-1234-ABCD">
<button id="check">Check</button>
<p id="result" aria-live="polite"></p>
</div>
<small>This website is part of the zaone OS project. Crash codes entered here should only be stored if the privacy notice clearly explains it.</small>
<script>
const known={
  "ZA-DEMO-0001":"Demo code: no real crash database has been connected yet."
};
document.querySelector("#check").addEventListener("click",()=>{
 const value=document.querySelector("#code").value.trim().toUpperCase();
 document.querySelector("#result").textContent=known[value]||"Unknown code. A hosted database/backend must be added before public use.";
});
</script>
</body>
</html>
